[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-cv"
version = "0.1.0"
description = "Basketball computer vision pipeline for tracking players, ball, and derived game stats."
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "pyyaml",
    "ultralytics",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
basketball-cv = "basketball_cv.pipelines.track_players:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
